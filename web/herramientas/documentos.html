  var CLAVE = 'documentos-ibero-acceso';
  var form = document.getElementById('candado');
  var campo = document.getElementById('codigo');
  var boton = document.getElementById('entrar');
  var error = document.getElementById('error');

  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function normalizar(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  function leer() { try { return localStorage.getItem(CLAVE) || ''; } catch (e) { return ''; } }
  function guardar(v) { try { v ? localStorage.setItem(CLAVE, v) : localStorage.removeItem(CLAVE); } catch (e) {} }

  function abrir(codigo) {
    var sub = crypto.subtle;
    return sub.importKey('raw', new TextEncoder().encode(normalizar(codigo)), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return sub.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(CAJA.s), iterations: CAJA.n },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (llave) { return sub.decrypt({ name: 'AES-GCM', iv: b64(CAJA.i) }, llave, b64(CAJA.c)); })
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }

  function mostrar(html) {
    document.open();
    document.write(html);
    document.close();
  }

  function pedir(mensaje) {
    form.hidden = false;
    error.textContent = mensaje || '';
    boton.disabled = false;
    boton.textContent = 'Entrar';
    campo.focus();
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var c = normalizar(campo.value);
    if (!c) return;
    boton.disabled = true;
    boton.textContent = 'Abriendo…';
    error.textContent = '';
    abrir(c).then(function (html) { guardar(c); mostrar(html); },
                  function () { pedir('Ese código no es válido. Revísalo o pide el vigente a Comunicación.'); campo.select(); });
  });

  if (!window.crypto || !crypto.subtle) {
    pedir('Este navegador no puede abrir la herramienta. Usa Chrome o Edge actualizados.');
    boton.disabled = true;
    return;
  }
  var recordado = leer();
  if (recordado) {
    abrir(recordado).then(mostrar, function () {
      guardar('');   /* el codigo cambio: se pide el nuevo */
      pedir('El código de acceso cambió. Escribe el vigente.');
    });
  } else {
    pedir('');
  }
