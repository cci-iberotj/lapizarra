  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "MyriadFirma", "Segoe UI", Arial, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  header.app {
    background: var(--rojo);
    padding: 20px 32px;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    text-align: center;
  }
  header.app h1 { font-family: "Alverata", Georgia, serif; font-size: 22px; font-weight: 700; color: #fff; letter-spacing: .2px; }
  header.app span { font-size: 13px; color: rgba(255,255,255,.85); }
  .layout {
    display: grid;
    grid-template-columns: 370px minmax(0, 1fr);
    gap: 26px;
    padding: 28px 32px 48px;
    max-width: 1200px;
    margin: 0 auto;
  }
  @media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } }

  .panel-caja {
    background: var(--panel);
    border: 1px solid var(--borde);
    border-radius: 14px;
    padding: 22px;
    box-shadow: var(--sombra);
  }
  .form-panel { align-self: start; }
  h2.sec {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    color: var(--texto-tenue);
    margin-bottom: 14px;
  }
  .campo { margin-bottom: 13px; }
  .campo label {
    display: block;
    font-size: 12px;
    color: var(--texto-suave);
    margin-bottom: 5px;
  }
  .campo input[type=text] {
    width: 100%;
    padding: 9px 12px;
    background: #fff;
    border: 1px solid var(--borde-fuerte);
    border-radius: 8px;
    color: var(--texto);
    font-size: 14px;
    font-family: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  .campo input[type=text]:focus {
    outline: none;
    border-color: var(--rojo);
    box-shadow: 0 0 0 3px rgba(225,37,27,.13);
  }
  .campo-doble { display: grid; grid-template-columns: 1fr 108px; gap: 10px; }

  .colores { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
  .color-fila { display: flex; align-items: center; gap: 9px; }
  .color-fila input[type=color] {
    width: 38px; height: 34px; padding: 0;
    border: 1px solid var(--borde-fuerte); border-radius: 8px;
    background: none; cursor: pointer;
  }
  .color-fila input[type=text] {
    width: 100%; padding: 8px 9px; font-size: 12.5px;
    background: #fff; border: 1px solid var(--borde-fuerte);
    border-radius: 8px; color: var(--texto);
    font-family: ui-monospace, Consolas, monospace; text-transform: uppercase;
  }
  .color-fila input[type=text]:focus {
    outline: none; border-color: var(--rojo);
    box-shadow: 0 0 0 3px rgba(225,37,27,.13);
  }

  /* ---- Zona de pegado y deteccion ---- */
  #pegado {
    width: 100%;
    min-height: 96px;
    resize: vertical;
    padding: 10px 12px;
    background: #FAFBFC;
    border: 1px dashed var(--borde-fuerte);
    border-radius: 9px;
    color: var(--texto);
    font-size: 12.5px;
    font-family: ui-monospace, Consolas, monospace;
    line-height: 1.5;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  #pegado:focus {
    outline: none; border-color: var(--rojo); border-style: solid;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(225,37,27,.13);
  }
  #pegado::placeholder { color: var(--texto-tenue); }
  .acciones-mini { display: flex; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
  .btn-mini {
    padding: 7px 13px;
    border: 1px solid var(--borde-fuerte);
    background: #fff;
    color: var(--texto-suave);
    border-radius: 7px;
    font-size: 12.5px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .btn-mini:hover { border-color: var(--texto-tenue); color: var(--texto); }
  .btn-mini.activo { background: var(--rojo); border-color: var(--rojo); color: #fff; }
  .btn-mini.activo:hover { background: var(--rojo-hover); border-color: var(--rojo-hover); color: #fff; }
  #detectadas { margin-top: 12px; display: flex; flex-direction: column; gap: 7px; }
  .chip {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: 9px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    color: var(--texto);
    transition: border-color .15s, background .15s;
  }
  .chip:hover { border-color: var(--borde-fuerte); background: #FAFBFC; }
  .chip.sel { border-color: var(--rojo); background: var(--rojo-tinte); }
  .chip .num {
    flex: none;
    width: 21px; height: 21px; border-radius: 50%;
    background: var(--rojo); color: #fff;
    font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .chip .txt { min-width: 0; }
  .chip .n { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip .c { font-size: 11.5px; color: var(--texto-tenue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vacio { font-size: 12px; color: var(--texto-tenue); font-style: italic; }
  .divisor { border: none; border-top: 1px solid var(--borde); margin: 20px 0 16px; }

  /* ---- Vista previa ---- */
  .preview-panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .preview-canvas {
    background: #FFFFFF;
    border: 1px solid var(--borde);
    border-radius: 14px;
    padding: 38px 30px;
    overflow-x: auto;
    box-shadow: var(--sombra);
  }
  /* Sin ancho fijo: lo pone cada diseño al dibujar, y el alto se
     deduce solo para que la proporcion aguante al encogerse. */
  #lienzo { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  .acciones { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button.btn {
    padding: 12px 20px;
    border: 1px solid transparent;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .1s;
  }
  button.btn:active { transform: scale(.97); }
  .btn-primario { background: var(--rojo); color: #fff; box-shadow: 0 1px 2px rgba(225,37,27,.3); }
  .btn-primario:hover { background: var(--rojo-hover); }
  .btn-secundario { background: #fff; color: var(--texto); border-color: var(--borde-fuerte); }
  .btn-secundario:hover { border-color: var(--texto-tenue); background: #FAFBFC; }
  .aviso {
    font-size: 12.5px;
    color: var(--texto-suave);
    line-height: 1.6;
    background: #F7F8FA;
    border: 1px solid var(--borde);
    border-radius: 11px;
    padding: 13px 16px;
  }
  .aviso strong { color: var(--texto); }
  #toast {
    position: fixed;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #17803D;
    color: #fff;
    padding: 12px 24px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    transition: all .3s ease;
    pointer-events: none;
    z-index: 99;
    box-shadow: 0 8px 24px rgba(24,25,30,.18);
  }
  #toast.visible { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast.error { background: #B3261E; }
</style>
</head>
<body>

<header class="app">
  <h1>Generador de Firmas</h1>
  <span>IBERO Tijuana</span>
</header>

<div class="layout">

  <div class="form-panel panel-caja">
    <h2 class="sec">Pegar texto de firmas</h2>
    <textarea id="pegado" spellcheck="false" placeholder="Pega aquí el texto de una o varias firmas. Se separan y se llenan solas."></textarea>
    <div class="acciones-mini">
      <button class="btn-mini activo" onclick="detectar()">Detectar</button>
      <button class="btn-mini" onclick="limpiarPegado()">Limpiar</button>
      <button class="btn-mini" id="btnTodas" style="display:none" onclick="descargarTodas()">⬇ Descargar todas</button>
    </div>
    <div id="detectadas"></div>

    <hr class="divisor">

    <h2 class="sec">Diseño</h2>
    <div class="campo">
      <label for="diseno">Cuál se usa</label>
      <select id="diseno">
        <option value="humano">Elige lo Humano (nueva)</option>
        <option value="clasica">Clásica</option>
      </select>
      <!-- Las dos conviven mientras aprueban la nueva. Al cambiar aqui
           cambia el lienzo entero: medidas, dibujo y codigo de correo. -->
    </div>

    <hr class="divisor">

    <h2 class="sec">Datos de la persona</h2>
    <div class="campo">
      <label for="nombre">Nombre completo (con grado)</label>
      <input type="text" id="nombre" value="Ing. Leonardo González Martínez">
    </div>
    <div class="campo">
      <label for="puesto">Puesto</label>
      <input type="text" id="puesto" value="Especialista en Diseño Gráfico">
    </div>

let fondoImg = null;

/* Posiciones sobre el lienzo de 600 x 215. La `y` es la BASE del
   texto, no su borde de arriba: es lo que pide fillText. Se
   calcularon desde la mancha de tinta medida y se afinaron
   comparando el render contra la imagen de Leo. */
const HUMANO = {
  W: 600, H: 215,
  izq: 47.8,          // margen de todo lo alineado a la izquierda
  der: 577,           // a donde cierra la direccion: el mismo borde
                      // donde acaba el renglon de redes del fondo
  /* La regla roja viene DENTRO del fondo y mide de 50 a 252. No se
     adapta al largo del puesto: por eso el puesto se aprieta para
     no pasarse de ahi, en vez de desbordarla. */
  reglaFin: 252,
  nombre:   { y:  73.5, tam: 24.5, peso: 700, max: 430 },
  puesto:   { y:  96.0, tam: 18.4, peso: 700, max: 203 },
  correo:   { y: 136.0, tam: 16.2, peso: 400, max: 330 },
  telefono: { y: 157.5, tam: 15.7, peso: 400, max: 330 },
  dir1:     { y: 161.0, tam: 11.0, peso: 400, max: 250 },
  dir2:     { y: 176.0, tam: 11.4, peso: 400, max: 250 },
};

// ---- Geometría de la clásica (medida sobre la firma original) ----
const W = 530, H = 190, SCALE = 3;
const PAD        = 27;   // margen izquierdo del texto
const GRIS_ANCHO = 374;  // dónde termina el bloque gris / empieza el rojo
const BLOQUE_BOT = 76;   // gris y rojo comparten borde superior (0) e inferior: encajan al ras
const CHAFLAN    = 16;   // un solo corte abajo-izquierda (gris) y otro arriba-derecha (rojo)

let logoImg = null;

function esc(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function datos() {
  const d = {};
  campos.forEach(c => d[c] = $(c).value.trim());
  d.rojo = $("colorRojo").value;
  d.gris = $("colorGris").value;
  d.diseno = $("diseno") ? $("diseno").value : "clasica";
  return d;
}

function cargarFondo() {
  return new Promise((resolve) => {
    const img = new Image();
    /* Si el fondo no carga se sigue sin el: mas vale una firma sin
       adorno que un lienzo en blanco sin explicacion. */
    img.onload = () => { fondoImg = img; resolve(); };
    img.onerror = () => resolve();
    img.src = FONDO_HUMANO;
  });
}

function cargarLogo() {
  return new Promise((resolve, reject) => {
    const blob = new Blob([LOGO_SVG], { type: "image/svg+xml" });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => { logoImg = img; URL.revokeObjectURL(url); resolve(); };
    img.onerror = reject;
    img.src = url;
  });
}

// Escribe el texto reduciendo el cuerpo si no cabe en el ancho disponible
function texto(ctx, str, x, y, peso, tam, familia, maxAncho) {
  const fam = familia === "alverata"
    ? '"Alverata", Georgia, serif'
    : '"MyriadFirma", Arial, sans-serif';
  let t = tam;
  ctx.font = `${peso} ${t}px ${fam}`;
  while (maxAncho && ctx.measureText(str).width > maxAncho && t > 6) {
    t -= 0.5;
    ctx.font = `${peso} ${t}px ${fam}`;
  }
  ctx.fillText(str, x, y);
  return ctx.measureText(str).width;
}

/* Dibuja el diseño nuevo: el fondo tal cual y el texto encima.
   Nada se dibuja a mano aqui --ni corchete, ni huellas, ni
   logotipo-- porque todo eso ya viene en la imagen. */
function dibujarHumano(d) {
  const G = HUMANO;
  const cv = $("lienzo");
  cv.width = G.W * SCALE;
  cv.height = G.H * SCALE;
  cv.style.width  = G.W + "px";
  cv.style.height = "auto";
  const ctx = cv.getContext("2d");
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.clearRect(0, 0, G.W, G.H);
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(0, 0, G.W, G.H);
  if (fondoImg) ctx.drawImage(fondoImg, 0, 0, G.W, G.H);
  ctx.textBaseline = "alphabetic";
  ctx.textAlign = "left";

  const pon = (str, c, conf, color, align) => {
    if (!str) return;
    ctx.fillStyle = color;
    ctx.textAlign = align || "left";
    texto(ctx, str, c, conf.y, conf.peso, conf.tam, "myriad", conf.max);
    ctx.textAlign = "left";
  };

  pon(d.nombre, G.izq, G.nombre, TINTA);
  pon(d.puesto, G.izq, G.puesto, d.rojo);
  pon(d.correo, G.izq, G.correo, TINTA);

  /* El telefono junta las dos capturas en un solo renglon, como en
     la referencia: "Tel. 664 630 15 77,  ext. 2413". Si no hay
     extension, no se escribe la coma colgando. */
  const tel = [d.telefono && "Tel. " + d.telefono, d.ext && "ext. " + d.ext]
              .filter(Boolean).join(",  ");
  pon(tel, G.izq, G.telefono, TINTA);

  // La direccion cierra contra el borde derecho, no arranca de un punto.
  pon(d.dir1, G.der, G.dir1, TINTA, "right");
  pon(d.dir2, G.der, G.dir2, TINTA, "right");
}

/* La nota de instalacion no es la misma para los dos diseños y
   dejarla fija haria que uno de los dos mintiera. */
function notaDeDiseno() {
  const pie = document.querySelector(".nota-instalar") || $("notaInstalar");
  if (!pie) return;
  const humano = $("diseno") && $("diseno").value === "humano";
  pie.innerHTML = humano
    ? '<b>Para instalarla en Outlook:</b> Descargar PNG → Outlook → Configuración → ' +
      'Firmas → insertar la imagen → guardar. <b>Este diseño viaja como imagen</b>, ' +
      'porque su fondo va detrás del texto y Outlook no pinta fondos bajo texto. ' +
      'Ojo: Outlook no carga las imágenes hasta que la persona lo autoriza, y hasta ' +
      'entonces se ve un recuadro vacío.'
    : '<b>Para instalarla en Outlook:</b> Descargar PNG → Outlook → Configuración → ' +
      'Firmas → insertar la imagen → guardar. El código HTML de esta versión es texto ' +
      'vivo: se puede seleccionar y no depende de que carguen las imágenes.';
}

function dibujar() {
  const d = datos();
  if (d.diseno === "humano") return dibujarHumano(d);
  const cv = $("lienzo");
  cv.width = W * SCALE;
  cv.height = H * SCALE;
  cv.style.width  = W + "px";
  cv.style.height = "auto";
  const ctx = cv.getContext("2d");
  ctx.scale(SCALE, SCALE);
  ctx.clearRect(0, 0, W, H);
  // Fondo blanco: sin él el PNG sale transparente y el texto oscuro
  // desaparece en clientes de correo con modo oscuro.
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = "alphabetic";

  // ---- Bloque gris: único corte en la esquina inferior izquierda ----
  ctx.fillStyle = d.gris;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(GRIS_ANCHO, 0);
  ctx.lineTo(GRIS_ANCHO, BLOQUE_BOT);
  ctx.lineTo(CHAFLAN, BLOQUE_BOT);
  ctx.lineTo(0, BLOQUE_BOT - CHAFLAN);
  ctx.closePath();
  ctx.fill();

  // ---- Bloque rojo: único corte en la esquina superior derecha ----
  ctx.fillStyle = d.rojo;
  ctx.beginPath();
  ctx.moveTo(GRIS_ANCHO, 0);
  ctx.lineTo(W - CHAFLAN, 0);
  ctx.lineTo(W, CHAFLAN);
  ctx.lineTo(W, BLOQUE_BOT);
  ctx.lineTo(GRIS_ANCHO, BLOQUE_BOT);
  ctx.closePath();
  ctx.fill();
  if (logoImg) {
    const lw = 114, lh = lw * (98.56 / 253.53);
    ctx.drawImage(logoImg, GRIS_ANCHO + (W - GRIS_ANCHO - lw) / 2, (BLOQUE_BOT - lh) / 2, lw, lh);
  }

  const anchoBarra = GRIS_ANCHO - PAD - 16;

  // Nombre (Alverata bold) y puesto (Myriad)
  ctx.fillStyle = "#FFFFFF";
  texto(ctx, d.nombre, PAD, 36, 700, 19, "alverata", anchoBarra);
  ctx.fillStyle = "#F0F0F0";
  texto(ctx, d.puesto, PAD, 54, 400, 12, "myriad", anchoBarra);

  // Correo (Alverata bold, rojo) — pegado al bloque gris
  ctx.fillStyle = d.rojo;
  texto(ctx, d.correo, PAD, 99, 700, 15.5, "alverata", W - PAD * 2);

  // Teléfono
  ctx.fillStyle = TINTA;
  const tel = "Tel. " + d.telefono + (d.ext ? ", ext. " + d.ext : "");
  texto(ctx, tel, PAD, 120, 400, 13, "myriad", W - PAD * 2);

  // Sitio web
  ctx.fillStyle = TINTA;
  const anchoWeb = texto(ctx, d.web, PAD, 137, 700, 13, "myriad", W - PAD * 2);

  // ---- Línea roja gruesa ----
  ctx.fillStyle = d.rojo;
  ctx.fillRect(PAD, 144, Math.max(anchoWeb + 38, 150), 3);

  // Dirección
  ctx.fillStyle = TINTA2;
  texto(ctx, d.dir1, PAD, 164, 400, 11, "myriad", W - PAD * 2);
  texto(ctx, d.dir2, PAD, 176, 400, 11, "myriad", W - PAD * 2);
}

// PNG del logo para la versión HTML (data URI)
function logoDataURI() {
  const lw = 114 * 3, lh = Math.round(lw * (98.56 / 253.53));
  const cv = document.createElement("canvas");
  cv.width = lw; cv.height = lh;
  cv.getContext("2d").drawImage(logoImg, 0, 0, lw, lh);
  return cv.toDataURL("image/png");
}

// ---- Versión HTML (texto seleccionable, tipografías seguras) ----
function generarFirmaHTML(d) {
  const serif = `Georgia,'Times New Roman',serif`;
  const sans  = `Arial,Helvetica,sans-serif`;
  const tel = "Tel. " + esc(d.telefono) + (d.ext ? ", ext. " + esc(d.ext) : "");
  return `<table cellpadding="0" cellspacing="0" border="0" width="530" style="border-collapse:collapse;width:530px;">
  <tr>
    <td valign="middle" bgcolor="${d.gris}" width="374" style="background-color:${d.gris};padding:11px 27px;">
      <div style="font-family:${serif};font-size:17px;font-weight:bold;color:#FFFFFF;line-height:1.25;white-space:nowrap;">${esc(d.nombre)}</div>
      <div style="font-family:${sans};font-size:12px;color:#F0F0F0;line-height:1.35;padding-top:3px;">${esc(d.puesto)}</div>
    </td>
    <td align="center" valign="middle" bgcolor="${d.rojo}" width="156" style="background-color:${d.rojo};padding:16px 21px;">
      <img src="${logoDataURI()}" alt="IBERO Tijuana" width="114" style="display:block;width:114px;height:auto;border:0;">
    </td>
  </tr>
  <tr><td colspan="2" style="padding:14px 27px 0 27px;">
    <a href="mailto:${esc(d.correo)}" style="font-family:${serif};font-size:15.5px;font-weight:bold;color:${d.rojo};text-decoration:none;">${esc(d.correo)}</a>
  </td></tr>
  <tr><td colspan="2" style="padding:8px 27px 0 27px;font-family:${sans};font-size:13px;color:#231F20;">${tel}</td></tr>
  <tr><td colspan="2" style="padding:4px 27px 0 27px;font-family:${sans};font-size:13px;font-weight:bold;color:#231F20;">
    <a href="https://${esc(d.web.replace(/^https?:\/\//,""))}" style="color:#231F20;text-decoration:none;">${esc(d.web)}</a>
  </td></tr>
  <tr><td colspan="2" style="padding:9px 27px 0 27px;">
    <div style="width:170px;height:3px;background-color:${d.rojo};font-size:0;line-height:0;">&nbsp;</div>
  </td></tr>
  <tr><td colspan="2" style="padding:8px 27px 4px 27px;font-family:${sans};font-size:11px;color:#58595B;line-height:1.45;">
    ${esc(d.dir1)}<br>${esc(d.dir2)}
  </td></tr>
</table>`;
}

/* ==========================================================
   Detección automática de firmas pegadas.
   Entiende dos formatos: texto corrido (como sale de una firma
   real) y listas etiquetadas del tipo "Nombre: …  Puesto: …".
   ========================================================== */

const RE_CORREO = /[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/;
const RE_WEB    = /(?:https?:\/\/)?www\.[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/i;
const RE_DOMINIO= /^[A-Za-z0-9.\-]+\.(?:mx|com|org|edu|net|gob)$/i;
const RE_EXT    = /\bext(?:ensi[oó]n)?\.?\s*:?\s*(\d{2,6})\b/i;
const RE_TITULO = /^(?:lic|ing|mtro|mtra|dr|dra|arq|psic|lae|lcc|mba|profa?|c\.?\s?p\.?)\b\.?\s+/i;
const RE_RUIDO  = /^(?:ibero(?:\s+tijuana)?|universidad\s+iberoamericana.*|tijuana|m[eé]xico|[-–—•|_=*]+)$/i;

// Etiquetas del formato "Etiqueta: valor"
const ET = {
  nombre: /^nombre(?:\s+completo)?\s*:\s*/i,
  puesto: /^(?:puesto|cargo|posici[oó]n)\s*:\s*/i,
  titulo: /^(?:t[ií]tulo|grado|abreviatura)\s*:\s*/i,
  correo: /^(?:correo(?:\s+electr[oó]nico)?|e-?mail)\s*:\s*/i,
  web:    /^(?:web|sitio(?:\s+web)?|p[aá]gina)\s*:\s*/i,
  dir:    /^(?:direcci[oó]n|domicilio)\s*:\s*/i,
  ext:    /^ext(?:ensi[oó]n)?\s*\.?\s*:?\s*\d{2,6}\s*$/i,
};
// Etiquetas que traen datos internos que no van en la firma
const ET_IGNORAR = /^(?:lugar|reporta|reporta\s+a|jefe|[aá]rea|departamento|adscripci[oó]n|campus|edificio|oficina|clave|n[oó]mina)\s*:/i;

function esCorreo(l)   { return RE_CORREO.test(l); }
function extraerWeb(l) {
  const m = l.match(RE_WEB);
  if (m) return m[0];
  const t = l.trim();
  return RE_DOMINIO.test(t) ? t : "";
}
function esWeb(l)       { return !esCorreo(l) && !!extraerWeb(l); }
function esDireccion(l) {
  return /(?:^|\s)(?:av|ave|avda|avenida|calle|blvd|boulevard|carr|carretera|prol|priv|calz|col|fracc)\b\.?/i.test(l)
      || /#\s*\d/.test(l)
      || /\bc\.?\s?p\.?\s*\d{4,5}\b/i.test(l);
}
function esTel(l) {
  if (esCorreo(l) || esDireccion(l)) return false;
  if (/\b(?:tel|tel[eé]fono|cel|celular|m[oó]vil|conmutador)\b/i.test(l)) return true;
  const digitos = (l.match(/\d/g) || []).length;
  return digitos >= 7 && l.replace(/[\d\s().\-+,/]/g, "").length <= 2;
}
function esDato(l) { return esCorreo(l) || esWeb(l) || esTel(l) || esDireccion(l) || ET.ext.test(l); }

function limpiarLineas(texto) {
  return texto.split(/\r?\n/)
    .map(l => l.replace(/\s+/g, " ").trim())
    .filter(l => l && !RE_RUIDO.test(l) && !ET_IGNORAR.test(l));
}

function dividirEnFirmas(texto) {
  const lineas = limpiarLineas(texto);
  const bloques = [];
  let actual = [];

  // Formato etiquetado: cada "Nombre:" arranca una firma nueva.
  if (lineas.some(l => ET.nombre.test(l))) {
    for (const l of lineas) {
      if (ET.nombre.test(l) && actual.length) { bloques.push(actual); actual = []; }
      actual.push(l);
    }
    if (actual.length) bloques.push(actual);
    return bloques;
  }

  // Texto corrido: una firma nueva empieza cuando, después de haber
  // visto ya un correo, aparece una línea que no es un dato.
  let vistoCorreo = false;
  for (const l of lineas) {
    if (vistoCorreo && !esDato(l)) {
      bloques.push(actual); actual = []; vistoCorreo = false;
    }
    actual.push(l);
    if (esCorreo(l)) vistoCorreo = true;
  }
  if (actual.length) bloques.push(actual);
  return bloques.filter(b => b.some(esCorreo) || b.length >= 2);
}

function parsearBloque(lineas) {
  const d = { nombre:"", puesto:"", correo:"", telefono:"", ext:"", web:"", dir1:"", dir2:"" };
  const otras = [], dirs = [];
  let titulo = "";

  const valor = (l, re) => l.slice(l.match(re)[0].length).trim();

  for (const l of lineas) {
    // ---- formato "Etiqueta: valor" ----
    if (ET.titulo.test(l)) { titulo = valor(l, ET.titulo); continue; }
    if (ET.nombre.test(l)) { d.nombre = valor(l, ET.nombre); continue; }
    if (ET.puesto.test(l)) { d.puesto = valor(l, ET.puesto); continue; }
    if (ET.correo.test(l)) {
      const c = valor(l, ET.correo).match(RE_CORREO);
      if (c) d.correo = c[0];
      continue;
    }
    if (ET.web.test(l)) { const v = valor(l, ET.web); d.web = extraerWeb(v) || v; continue; }
    if (ET.dir.test(l)) { dirs.push(valor(l, ET.dir)); continue; }
    // línea que sólo trae la extensión: "Ext. 2393"
    if (ET.ext.test(l)) { const n = l.match(/\d{2,6}/); if (n) d.ext = n[0]; continue; }

    // ---- texto corrido ----
    if (!d.correo && esCorreo(l)) {
      d.correo = l.match(RE_CORREO)[0];
      if (l.replace(RE_CORREO, "").replace(/[\s:|·,\-]/g, "") === "") continue;
    }
    if (esDireccion(l)) { dirs.push(l); continue; }
    if (esTel(l)) {
      const m = l.match(RE_EXT);
      if (m) d.ext = m[1];
      const t = l.replace(RE_EXT, "")
                 .replace(/\b(?:tel[eé]fono|tel|cel(?:ular)?|m[oó]vil|conmutador)\b\.?\s*:?\s*/i, "")
                 .replace(/^[\s:,;.\-]+|[\s:,;.\-]+$/g, "")
                 .trim();
      if (t) d.telefono = t;
      continue;
    }
    if (esWeb(l)) { d.web = extraerWeb(l); continue; }
    if (!esCorreo(l)) otras.push(l);
  }

  d.dir1 = dirs[0] || "";
  d.dir2 = dirs[1] || "";

  // En texto corrido el nombre es la línea con grado (Lic., Ing., …);
  // si no hay, la primera línea suelta. El resto es el puesto.
  if (!d.nombre && otras.length) {
    let i = otras.findIndex(l => RE_TITULO.test(l));
    if (i < 0) i = 0;
    d.nombre = otras[i];
    if (!d.puesto) d.puesto = otras.filter((_, j) => j !== i).join(" ").trim();
  } else if (!d.puesto && otras.length) {
    d.puesto = otras.join(" ").trim();
  }

  // "Título: Lic." viene aparte: se antepone al nombre si no lo trae ya.
  if (titulo && d.nombre) {
    const t = titulo.replace(/[\s.]+$/, "");
    if (!new RegExp("^\\s*" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i").test(d.nombre)) {
      d.nombre = titulo.replace(/\s+$/, "") + " " + d.nombre;
    }
  }
  return d;
}

let firmasDetectadas = [], firmaActiva = -1;

function detectar() {
  const txt = $("pegado").value;
  const cont = $("detectadas");
  if (!txt.trim()) {
    firmasDetectadas = [];
    cont.innerHTML = `<p class="vacio">Pega el texto arriba y presiona Detectar.</p>`;
    $("btnTodas").style.display = "none";
    return;
  }
  firmasDetectadas = dividirEnFirmas(txt).map(parsearBloque);
  if (!firmasDetectadas.length) {
    cont.innerHTML = `<p class="vacio">No reconocí ninguna firma. Llena los campos a mano.</p>`;
    $("btnTodas").style.display = "none";
    return;
  }
  cont.innerHTML = firmasDetectadas.map((f, k) => `
    <button class="chip" data-k="${k}" onclick="cargarFirma(${k})">
      <span class="num">${k + 1}</span>
      <span class="txt">
        <span class="n">${esc(f.nombre || "(sin nombre)")}</span><br>
        <span class="c">${esc(f.correo || "(sin correo)")}</span>
      </span>
    </button>`).join("");
  $("btnTodas").style.display = firmasDetectadas.length > 1 ? "" : "none";
  cargarFirma(0);
  toast(`✓ ${firmasDetectadas.length} firma${firmasDetectadas.length > 1 ? "s" : ""} detectada${firmasDetectadas.length > 1 ? "s" : ""}`);
}

function cargarFirma(k) {
  const f = firmasDetectadas[k];
  if (!f) return;
  firmaActiva = k;
  // Teléfono, web y dirección son los mismos para toda la universidad: si no
  // vienen en el texto se conservan (lo normal es que sólo cambie la extensión).
  // Los datos de la persona sí se limpian, para no arrastrar los de la firma anterior.
  const COMUNES = ["telefono", "web", "dir1", "dir2"];
  campos.forEach(c => {
    if (f[c]) $(c).value = f[c];
    else if (!COMUNES.includes(c)) $(c).value = "";
  });
  document.querySelectorAll(".chip").forEach(ch =>
    ch.classList.toggle("sel", Number(ch.dataset.k) === k));
  dibujar();
}

function limpiarPegado() {
  $("pegado").value = "";
  firmasDetectadas = [];
  firmaActiva = -1;
  $("detectadas").innerHTML = "";
  $("btnTodas").style.display = "none";
}

async function descargarTodas() {
  for (let k = 0; k < firmasDetectadas.length; k++) {
    cargarFirma(k);
    await new Promise(r => setTimeout(r, 150));
    const blob = await canvasPNG();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = nombreArchivo() + ".png";
    a.click();
    URL.revokeObjectURL(a.href);
    await new Promise(r => setTimeout(r, 400));
  }
  toast(`✓ ${firmasDetectadas.length} PNG descargados`);
}

$("pegado").addEventListener("paste", () => setTimeout(detectar, 30));

function toast(msg, esError) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.toggle("error", !!esError);
  t.classList.add("visible");
  setTimeout(() => t.classList.remove("visible"), 2600);
}

function nombreArchivo() {
  return "firma-" + (datos().nombre.normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-zA-Z ]/g,"").trim().replace(/ +/g,"-").toLowerCase() || "ibero");
}

function canvasPNG() {
  return new Promise(resolve => $("lienzo").toBlob(resolve, "image/png"));
}

async function descargarPNG() {
  const blob = await canvasPNG();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nombreArchivo() + ".png";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("✓ PNG descargado");
}

async function copiarPNG() {
  try {
    const blob = await canvasPNG();
    await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
    toast("✓ Imagen copiada — pégala en Outlook con Ctrl+V");
  } catch (e) {
    toast("⚠ El navegador bloqueó el copiado. Usa Descargar PNG", true);
  }
}

/* EL CODIGO HTML DEL DISEÑO NUEVO ES UNA IMAGEN, Y HAY QUE DECIRLO

   La clasica se arma con una <table> de texto vivo: se puede
   seleccionar, el correo es un enlace y no depende de que el cliente
   cargue imagenes.

   «Elige lo Humano» no puede hacer eso. Su fondo --las huellas, el
   corchete, el logotipo-- va DETRAS del texto, y Outlook no pinta
   imagenes de fondo bajo texto: usa el motor de Word, que ignora
   background-image en casi todo. Asi que la firma viaja como una
   sola imagen.

   Eso tiene un costo que quien la instale debe conocer: Outlook no
   carga las imagenes hasta que la persona lo autoriza, y mientras
   tanto la firma se ve como un recuadro vacio. Por eso el codigo que
   se copia lleva el texto alternativo con los datos, que es lo que
   se lee cuando la imagen no carga.

   Antes de esto, el boton copiaba la tabla de la CLASICA aunque
   estuviera elegida la nueva: el codigo no se parecia a la vista
   previa y nadie lo habria notado hasta pegarlo. */
function firmaHumanaHTML(d) {
  const cv = $("lienzo");
  const png = cv.toDataURL("image/png");
  const alt = [d.nombre, d.puesto, d.correo].filter(Boolean).join(" · ");
  return '<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse">' +
         '<tr><td style="padding:0">' +
         '<img src="' + png + '" alt="' + esc(alt) + '" width="600" ' +
         'style="display:block;width:600px;height:auto;border:0">' +
         '</td></tr></table>';
}

async function copiarHTML() {
  const d = datos();
  try {
    if (d.diseno === "humano") {
      await navigator.clipboard.writeText(firmaHumanaHTML(d));
      toast("✓ Copiado. Este diseño viaja como imagen; mira la nota de abajo.");
    } else {
      await navigator.clipboard.writeText(generarFirmaHTML(d));
      toast("✓ Código HTML copiado");
    }
  } catch (e) {
    toast("⚠ El navegador bloqueó el copiado", true);
  }
}

// ---- Enlaces entre selector de color y campo hexadecimal ----
function ligarColor(idColor, idHex) {
  const c = $(idColor), h = $(idHex);
  c.addEventListener("input", () => { h.value = c.value.toUpperCase(); dibujar(); });
  h.addEventListener("input", () => {
    let v = h.value.trim();
    if (!v.startsWith("#")) v = "#" + v;
    if (/^#[0-9a-fA-F]{6}$/.test(v)) { c.value = v; dibujar(); }
  });
}
ligarColor("colorRojo", "hexRojo");
ligarColor("colorGris", "hexGris");
campos.forEach(c => $(c).addEventListener("input", dibujar));

(async () => {
  try {
    await Promise.all([
      document.fonts.load('400 16px "Alverata"'),
      document.fonts.load('700 16px "Alverata"'),
      document.fonts.load('400 12px "MyriadFirma"'),
      document.fonts.load('600 12px "MyriadFirma"'),
      document.fonts.load('700 12px "MyriadFirma"'),
      cargarLogo(),
      cargarFondo()
    ]);
  } catch (e) { /* dibuja con lo que haya cargado */ }

  /* El selector de diseño cambia el lienzo entero --medidas, dibujo y
     nota de instalacion-- asi que se engancha aqui, una sola vez al
     cargar. Estuvo un rato dentro de aplicar(), que corre cada vez que
     se elige una firma detectada: ahi se enganchaba uno nuevo por cada
     clic y ninguno al abrir la pagina. */
  const selDiseno = $("diseno");
  if (selDiseno) selDiseno.addEventListener("change", () => { dibujar(); notaDeDiseno(); });
  notaDeDiseno();
  dibujar();
})();
</script>
